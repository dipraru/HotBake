version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: hotbake-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotbake}
      POSTGRES_USER: ${POSTGRES_USER:-hotbake_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotbake_pass}
    volumes:
      - hotbake-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotbake_user} -d ${POSTGRES_DB:-hotbake}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Application ───────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotbake-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-hotbake}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-hotbake_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-hotbake_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  hotbake-db-data:
    driver: local
