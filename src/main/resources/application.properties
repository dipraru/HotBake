# ==========================================
# HotBake Application Configuration
# ==========================================

# Application
spring.application.name=hotbake
server.port=8080

# ==========================================
# Database (PostgreSQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hotbake}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hotbake_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hotbake_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================
# Security
# ==========================================
spring.security.user.name=admin
spring.security.user.password=admin

# ==========================================
# Thymeleaf
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ==========================================
# Actuator (for health checks on Render)
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ==========================================
# Logging
# ==========================================
logging.level.com.hotbake=INFO
logging.level.org.springframework.security=WARN
