<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main>
<div class="container" style="padding:2rem 0;max-width:680px">
  <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:1.5rem">My Profile</h1>
  <div th:replace="~{fragments/layout :: flash}"></div>

  <div class="card mb-3">
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:1rem">
        <div style="width:60px;height:60px;border-radius:50%;background:var(--rose-100);color:var(--rose-600);display:grid;place-items:center;font-size:1.5rem;font-weight:800">
          <span th:text="${#strings.substring(user.firstName,0,1)}">A</span>
        </div>
        <div>
          <h2 style="font-size:1.15rem;margin:0" th:text="${user.fullName}">Name</h2>
          <p style="color:var(--color-muted);font-size:0.85rem;margin:0" th:text="${user.email}"></p>
        </div>
      </div>
    </div>
    <div class="card-body">
      <form th:action="@{/buyer/profile/update}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" name="firstName" th:value="${user.firstName}" class="form-control" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" name="lastName" th:value="${user.lastName}" class="form-control" required/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" th:value="${user.phone}" class="form-control" placeholder="01XXXXXXXXX"/>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address <span class="text-muted">(cannot be changed)</span></label>
          <input type="email" th:value="${user.email}" class="form-control" readonly style="background:var(--neutral-100)"/>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>

  <!-- Change Password -->
  <div class="card mb-3">
    <div class="card-header">
      <h3 style="font-size:1rem"><i class="fa-solid fa-lock"></i> Change Password</h3>
    </div>
    <div class="card-body">
      <form th:action="@{/buyer/profile/change-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input type="password" name="currentPassword" class="form-control" placeholder="Enter your current password" required/>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" name="newPassword" class="form-control" placeholder="Enter new password (minimum 6 characters)" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="confirmPassword" class="form-control" placeholder="Confirm new password" required/>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Change Password</button>
      </form>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem">
    <a th:href="@{/buyer/orders}" class="card card-hover" style="padding:1.25rem;text-align:center;text-decoration:none;color:inherit">
      <div style="font-size:1.75rem;color:var(--color-primary);margin-bottom:0.5rem"><i class="fa-solid fa-box"></i></div>
      <strong style="font-size:0.9rem">My Orders</strong>
    </a>
    <a th:href="@{/buyer/addresses}" class="card card-hover" style="padding:1.25rem;text-align:center;text-decoration:none;color:inherit">
      <div style="font-size:1.75rem;color:var(--color-primary);margin-bottom:0.5rem"><i class="fa-solid fa-location-dot"></i></div>
      <strong style="font-size:0.9rem">Addresses</strong>
    </a>
    <a th:href="@{/buyer/reviews}" class="card card-hover" style="padding:1.25rem;text-align:center;text-decoration:none;color:inherit">
      <div style="font-size:1.75rem;color:var(--color-primary);margin-bottom:0.5rem"><i class="fa-solid fa-star"></i></div>
      <strong style="font-size:0.9rem">My Reviews</strong>
    </a>
    <a th:href="@{/auth/seller-apply}" class="card card-hover" style="padding:1.25rem;text-align:center;text-decoration:none;color:inherit">
      <div style="font-size:1.75rem;color:var(--color-primary);margin-bottom:0.5rem"><i class="fa-solid fa-store"></i></div>
      <strong style="font-size:0.9rem">Sell on HotBake</strong>
    </a>
  </div>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
