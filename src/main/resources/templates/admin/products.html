<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Products')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="dashboard-layout">
  <aside class="sidebar admin-sidebar">
    <div class="sidebar-brand"><div class="shop-name">HotBake Admin</div><div class="role-tag">Administrator</div></div>
    <p class="sidebar-nav-label">Management</p>
    <a th:href="@{/admin/dashboard}" class="sidebar-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a th:href="@{/admin/sellers}" class="sidebar-link"><i class="fa-solid fa-store"></i> Sellers</a>
    <a th:href="@{/admin/users}" class="sidebar-link"><i class="fa-solid fa-users"></i> Users</a>
    <a th:href="@{/admin/products}" class="sidebar-link active"><i class="fa-solid fa-cake-candles"></i> Products</a>
    <a th:href="@{/admin/reviews}" class="sidebar-link"><i class="fa-solid fa-star"></i> Reviews</a>
    <p class="sidebar-nav-label">System</p>
    <a th:href="@{/}" class="sidebar-link"><i class="fa-solid fa-globe"></i> Visit Store</a>
    <form th:action="@{/auth/logout}" method="post" style="margin:0">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="sidebar-link" style="width:100%;border:none;background:none;cursor:pointer;text-align:left">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </form>
  </aside>
  <main class="dash-main">
    <div class="dash-header"><h1>Product Management</h1><p>Monitor and moderate all marketplace products</p></div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Image</th><th>Product</th><th>Shop</th><th>Category</th><th>Price/lb</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            <tr th:each="product : ${products}">
              <td>
                <img th:if="${product.primaryImage != null}"
                     th:src="@{/images/{id}(id=${product.primaryImage.id})}"
                     class="img-thumbnail"/>
                <div th:if="${product.primaryImage == null}"
                     style="width:48px;height:48px;background:var(--rose-100);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--rose-400)">
                  <i class="fa-solid fa-cake-candles"></i>
                </div>
              </td>
              <td>
                <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}"
                   style="font-weight:600;color:var(--color-primary)"></a>
              </td>
              <td style="font-size:0.85rem" th:text="${product.sellerProfile.shopName}"></td>
              <td><span class="badge badge-pending" th:text="${product.category.displayName}"></span></td>
              <td style="font-weight:700">৳ <span th:text="${#numbers.formatDecimal(product.pricePerPound,0,'COMMA',2,'POINT')}"></span></td>
              <td>
                <span th:if="${product.isAvailable()}" class="badge badge-delivered">Active</span>
                <span th:unless="${product.isAvailable()}" class="badge badge-cancelled">Hidden</span>
              </td>
              <td>
                <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Permanently delete this product?')">
                    <i class="fa-solid fa-trash"></i> Delete
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="empty-state" th:if="${products.isEmpty()}"><p>No products found.</p></div>
    </div>
  </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
