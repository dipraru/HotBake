<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div style="min-height:60vh;display:grid;place-items:center;padding:3rem 1rem">
  <div style="text-align:center;max-width:480px">
    <div style="font-size:6rem;font-weight:900;color:var(--neutral-200);line-height:1;margin-bottom:1rem"
         th:text="${errorCode != null ? errorCode : '500'}">500</div>
    <h1 style="font-size:1.5rem;margin-bottom:0.75rem"
        th:text="${errorTitle != null ? errorTitle : 'Something went wrong'}">Error</h1>
    <p style="color:var(--color-muted);margin-bottom:2rem"
       th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred. Please try again.'}">Message</p>
    <div style="display:flex;gap:1rem;justify-content:center">
      <a th:href="@{/}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Go Home</a>
      <a href="javascript:history.back()" class="btn btn-outline">Go Back</a>
    </div>
  </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
