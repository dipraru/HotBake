<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Products')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="shop-name">Seller Panel</div>
      <div class="role-tag">Products</div>
    </div>
    <a th:href="@{/seller/dashboard}" class="sidebar-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a th:href="@{/seller/products}" class="sidebar-link active"><i class="fa-solid fa-cake-candles"></i> My Products</a>
    <a th:href="@{/seller/products/add}" class="sidebar-link"><i class="fa-solid fa-plus"></i> Add Product</a>
    <a th:href="@{/seller/orders}" class="sidebar-link"><i class="fa-solid fa-box"></i> Orders</a>
    <a th:href="@{/}" class="sidebar-link"><i class="fa-solid fa-store"></i> Visit Store</a>
  </aside>
  <main class="dash-main">
    <div class="dash-header d-flex justify-between align-center">
      <div><h1>My Products</h1><p>Manage your cake listings</p></div>
      <a th:href="@{/seller/products/add}" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Product</a>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card">
      <div class="table-wrap" th:if="${!products.isEmpty()}">
        <table>
          <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price/lb</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="product : ${products}">
              <td>
                <img th:if="${product.primaryImage != null}"
                     th:src="@{/images/{id}(id=${product.primaryImage.id})}"
                     class="img-thumbnail" alt="Product"/>
                <div th:if="${product.primaryImage == null}"
                     style="width:48px;height:48px;background:var(--rose-100);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--rose-400)">
                  <i class="fa-solid fa-cake-candles"></i>
                </div>
              </td>
              <td>
                <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}" style="font-weight:600;color:var(--color-primary)"></a>
              </td>
              <td><span class="badge badge-pending" th:text="${product.category.displayName}"></span></td>
              <td style="font-weight:700">৳ <span th:text="${#numbers.formatDecimal(product.pricePerPound,0,'COMMA',2,'POINT')}"></span></td>
              <td>
                <span th:if="${product.isAvailable()}" class="badge badge-delivered">Active</span>
                <span th:unless="${product.isAvailable()}" class="badge badge-cancelled">Hidden</span>
              </td>
              <td>
                <div class="action-group">
                  <a th:href="@{/seller/products/edit/{id}(id=${product.id})}" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-pen"></i>
                  </a>
                  <form th:action="@{/seller/products/delete/{id}(id=${product.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this product?')">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="empty-state" th:if="${products.isEmpty()}">
        <div class="empty-icon"><i class="fa-solid fa-cake-candles"></i></div>
        <h3>No products yet</h3>
        <p>Add your first cake to start selling!</p>
        <a th:href="@{/seller/products/add}" class="btn btn-primary">Add Product</a>
      </div>
    </div>
  </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
