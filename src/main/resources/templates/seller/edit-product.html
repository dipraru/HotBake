<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Product')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="shop-name">Seller Panel</div><div class="role-tag">Edit Product</div></div>
    <a th:href="@{/seller/dashboard}" class="sidebar-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a th:href="@{/seller/products}" class="sidebar-link active"><i class="fa-solid fa-cake-candles"></i> My Products</a>
    <a th:href="@{/seller/products/add}" class="sidebar-link"><i class="fa-solid fa-plus"></i> Add Product</a>
    <a th:href="@{/seller/orders}" class="sidebar-link"><i class="fa-solid fa-box"></i> Orders</a>
    <a th:href="@{/}" class="sidebar-link"><i class="fa-solid fa-store"></i> Visit Store</a>
  </aside>
  <main class="dash-main">
    <div class="dash-header">
      <div class="breadcrumb"><a th:href="@{/seller/products}">Products</a> / Edit</div>
      <h1>Edit Product</h1>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card" style="max-width:760px">
      <div class="card-body">
        <!-- Existing images -->
        <div th:if="${!product.images.isEmpty()}" style="margin-bottom:1.5rem">
          <label class="form-label">Current Images</label>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
            <div th:each="img : ${product.images}" style="position:relative">
              <img th:src="@{/images/{id}(id=${img.id})}" class="upload-preview-img"/>
              <span th:if="${img.isPrimary()}"
                    style="position:absolute;bottom:2px;left:2px;font-size:0.6rem;background:var(--color-primary);color:hsl(0,0%,100%);padding:1px 4px;border-radius:2px">Cover</span>
            </div>
          </div>
          <p class="form-hint">Upload new images below to replace all existing ones.</p>
        </div>

        <form th:action="@{/seller/products/edit/{id}(id=${product.id})}" method="post"
              enctype="multipart/form-data" th:object="${productDto}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-group">
            <label class="form-label">Product Name *</label>
            <input type="text" th:field="*{name}" class="form-control" required/>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
            <div class="form-group">
              <label class="form-label">Category *</label>
              <select th:field="*{category}" class="form-control" required>
                <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.displayName}"></option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Price per Pound (৳) *</label>
              <input type="number" th:field="*{pricePerPound}" class="form-control" step="0.01" min="0.01" required/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description *</label>
            <textarea th:field="*{description}" class="form-control" rows="5" required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Replace Images <span class="text-muted">(optional)</span></label>
            <div class="upload-zone" id="uploadZone">
              <input type="file" th:name="images" id="imageUploadInput" multiple accept="image/*" style="display:none"/>
              <i class="fa-solid fa-cloud-arrow-up" style="font-size:2rem;color:var(--neutral-400);display:block;margin-bottom:0.5rem"></i>
              <p style="font-size:0.9rem;color:var(--neutral-500);margin:0">Click or drag to upload new images</p>
            </div>
            <div class="upload-previews" id="imagePreviews"></div>
          </div>
          <div class="form-check form-group">
            <input type="checkbox" th:field="*{available}" id="available"/>
            <label for="available" class="form-label" style="margin:0">Product is active and visible</label>
          </div>
          <div style="display:flex;gap:0.75rem">
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Changes</button>
            <a th:href="@{/seller/products}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
