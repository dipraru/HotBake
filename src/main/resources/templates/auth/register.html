<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Account')}"></head>
<body>
<div class="auth-layout">
  <div class="auth-card" style="max-width:520px">
    <div class="auth-header">
      <div class="auth-logo"><i class="fa-solid fa-cake-candles"></i></div>
      <h2>Create Account</h2>
      <p>Join HotBake — start ordering today</p>
    </div>
    <div class="auth-body">
      <form th:action="@{/auth/register}" method="post" th:object="${user}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" th:field="*{firstName}" class="form-control"
                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                   placeholder="Rahim" required/>
            <p class="form-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" th:field="*{lastName}" class="form-control"
                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                   placeholder="Uddin" required/>
            <p class="form-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" th:field="*{email}" class="form-control"
                 th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                 placeholder="you@example.com" required/>
          <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number <span class="text-muted">(optional)</span></label>
          <input type="tel" th:field="*{phone}" class="form-control" placeholder="01XXXXXXXXX"/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" th:field="*{password}" class="form-control"
                 th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                 placeholder="At least 6 characters" required/>
          <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" th:field="*{confirmPassword}" class="form-control"
                 th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                 placeholder="Repeat your password" required/>
          <p class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>
    </div>
    <div class="auth-footer">
      Already have an account? <a th:href="@{/auth/login}">Login here</a>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
