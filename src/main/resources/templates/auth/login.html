<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<div class="auth-layout">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><i class="fa-solid fa-cake-candles"></i></div>
      <h2>Welcome Back</h2>
      <p>Sign in to your HotBake account</p>
    </div>
    <div class="auth-body">
      <div th:if="${param.error}" class="flash flash-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>Invalid email or password. Please try again.</span>
      </div>
      <div th:if="${param.logout}" class="flash flash-success">
        <i class="fa-solid fa-circle-check"></i>
        <span>You have been logged out successfully.</span>
      </div>
      <div th:replace="~{fragments/layout :: flash}"></div>

      <form th:action="@{/auth/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autofocus/>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
      </form>
    </div>
    <div class="auth-footer">
      Don't have an account? <a th:href="@{/auth/register}">Sign up for free</a>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
